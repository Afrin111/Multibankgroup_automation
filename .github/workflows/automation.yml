name: mb.io Cross-Browser CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ══ CHROME ════════════════════════════════════════════════
  test-chrome:
    name: Tests on Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
          | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
          >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Create output dirs
        run: mkdir -p test-output/reports test-output/screenshots

      - name: Run Tests on Chrome
        run: mvn test -DsuiteXmlFile=testng-chrome.xml -B
        continue-on-error: true

      - name: Upload Chrome Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Report-Chrome
          path: test-output/reports/
          retention-days: 30

      - name: Upload Chrome Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots-Chrome
          path: test-output/screenshots/
          retention-days: 30

  # ══ FIREFOX ═══════════════════════════════════════════════
  test-firefox:
    name: Tests on Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox

      - name: Create output dirs
        run: mkdir -p test-output/reports test-output/screenshots

      - name: Run Tests on Firefox
        run: mvn test -DsuiteXmlFile=testng-firefox.xml -B
        continue-on-error: true

      - name: Upload Firefox Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Report-Firefox
          path: test-output/reports/
          retention-days: 30

      - name: Upload Firefox Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots-Firefox
          path: test-output/screenshots/
          retention-days: 30

  # ══ EDGE ══════════════════════════════════════════════════
  test-edge:
    name: Tests on Edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install Edge
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc \
          | gpg --dearmor > microsoft.gpg
          sudo install -o root -g root -m 644 microsoft.gpg \
          /etc/apt/trusted.gpg.d/
          sudo sh -c 'echo "deb [arch=amd64] \
          https://packages.microsoft.com/repos/edge stable main" \
          > /etc/apt/sources.list.d/microsoft-edge-dev.list'
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

      - name: Create output dirs
        run: mkdir -p test-output/reports test-output/screenshots

      - name: Run Tests on Edge
        run: mvn test -DsuiteXmlFile=testng-edge.xml -B
        continue-on-error: true

      - name: Upload Edge Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Report-Edge
          path: test-output/reports/
          retention-days: 30

      - name: Upload Edge Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots-Edge
          path: test-output/screenshots/
          retention-days: 30
